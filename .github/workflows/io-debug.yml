name: io-debug

on:
  push:
    paths:
      - .github/workflows/io-debug.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump container io.stat semantics
        run: |
          uname -r
          docker run --rm alpine sh -c '
            dd if=/dev/zero of=/tmp/f bs=1M count=100 2>/dev/null
            sync
            echo "--- io.stat ---"
            cat /sys/fs/cgroup/io.stat
            echo "--- cgroup.controllers ---"
            cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null
            echo "--- cgroup.subtree_control ---"
            cat /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null
          '
          echo "--- host io.stat (runner root cgroup) ---"
          cat /sys/fs/cgroup/io.stat 2>/dev/null
          lsblk -d -o NAME,TYPE,SIZE 2>/dev/null
