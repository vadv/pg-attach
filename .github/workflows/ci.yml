name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-matrix:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    env:
      PG_VERSION: ${{ matrix.pg }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build, lint and run BDD scenarios
        run: make bdd

      - name: Upload BDD logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-logs-pg${{ matrix.pg }}
          path: target/bdd-logs/
          if-no-files-found: ignore
