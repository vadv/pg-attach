[package]
name = "pg_attach"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "PostgreSQL"
description = "Physical table transfer between matching PostgreSQL 16-18 clusters"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg17"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]

[dependencies]
pgrx = "=0.19.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
debug = true
